<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project 7: Hex Code Color Flipper</title>

    <!-- Style Element -->
    <style>
        /* CSS Reset */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f1f5f9;
            padding: 20px;
            transition: background-color 0.4s ease;
        }

        .card {
            background-color: #fff;
            padding: 32px;
            border-radius: 12px;
            text-align: center;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
        }

        h2 {
            font-size: 1.3rem;
            color: #0f172a;
            margin-bottom: 20px;
        }

        .color-display {
            background-color: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 24px;
            font-size: 1rem;
            color: #64748b;
            display: flex;
            justify-content: center;
            gap: 8px;
            align-items: center;
        }

        #hex-code {
            font-size: 1.4rem;
            font-weight: bold;
            color: #0f172a;
            letter-spacing: 1px;
        }

        .button-group {
            display: flex;
            gap: 10px;
        }

        .btn {
            flex: 1;
            padding: 10px 14px;
            border: none;
            border-radius: 6px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .primary-btn {
            background-color: #0f172a;
            color: #ffffff;
        }

        .secondary-btn {
            background-color: #e2e8f0;
            color: #1e293b;
        }


    </style>
</head>
<body>
    <main class="card">
        <h2>Hex Color Flipper</h2>

        <div class="color-display">
            <span>Background:</span>
            <strong id="hex-code">#F1F5F9</strong>
        </div>

        <div class="button-group">
            <button id="generate-btn" class="btn primary-btn">Generate Color</button>
            <button id="copy-btn" class="btn secondary-btn">Copy Code</button>
        </div>
    </main>
    <script src="index.js"></script>
</body>
</html>
