<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project 6: Tip Calculator</title>

    <!-- Style Element -->
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f1f5f9;
            padding: 20px;
        }

        .calculator-card {
            background-color: #ffffff;
            padding: 28px;
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 380px;
        }

        h2 {
            font-size: 1.4rem;
            color: #0f172a;
            margin-bottom: 20px;
            text-align: center;
        }

        .input-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: #475569;
            margin-bottom: 6px;
        }

        input, select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 0.95rem;
            outline: none;
            background-color: #ffffff;
            color: #1e293b;
        }

        input:focus, select:focus {
            border-color: #2563eb;
        }

        button {
            width: 100%;
            padding: 11px;
            background-color: #2563eb;
            color: #ffffff;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            margin-top: 8px;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #1d4ed8;
        }

        /* Results section */

        .result-box {
            margin-top: 24px;
            padding: 16px;
            background-color: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
        }

        .result-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            font-size: 0.9rem;
            color: #0f172a;
        }

        .total-row {
            margin-bottom: 0;
            padding-top: 8px;
            border-top: 1px dashed #cbd531;
        }

        .total-row strong {
            color: #2563eb;
            font-size: 1.25rem;
        }
    </style>
</head>
<body>
    <main class="calculator-card">
        <h2>Tip Calculator</h2>

        <!-- Bill Input -->
        <div class="input-group">
            <label for="bill-amount">Bill Amount (₹ / $)</label>
            <input type="number" id="bill-amount" placeholder="0.00" min="0" step="any">
        </div>

        <!-- Tip Percentage Dropdown -->
        <div class="input-group">
            <label for="tip-percent">Select Tip</label>
            <select id="tip-percent">
                <option value="0.05">5% - Service was okay</option>
                <option value="0.10">10% - Good service</option>
                <option value="0.15">15% - Great service</option>
                <option value="0.20">20% - Outstanding</option>
            </select>
        </div>
    
        <!-- People Count Input -->
        <div class="input-group">
            <label for="people-count">Number of People</label>
            <input type="number" id="people-count" value="1" min="1">
        </div>

        <button id="calculate-btn">Calculate Split</button>

        <!-- Result Display Area -->
        <div class="result-box">
            <div class="result-row">
                <span>Tip per Person:</span>
                <strong id="tip-per-person">₹0.00</strong>
            </div>
            <div class="result-row total-row">
                <span>Total per Person:</span>
                <strong id="total-per-person">₹0.00</strong>
            </div>
        </div>
    </main>
    <script src="index.js"></script>
</body>
</html>
