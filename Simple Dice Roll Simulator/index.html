<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project 10: Dice Roll Simulator</title>

    <!-- Style Element -->
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f1f5f8;
            padding: 20px;
        }

        .dice-card {
            background-color: #fff;
            padding: 32px 24px;
            border-radius: 12px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
            text-align: center;
        }

        h2 {
            font-size: 1.3rem;
            color: #0f172a;
            margin-bottom: 20px;
        }

        /* Big Unicode Dice Face */

        .dice-display {
            font-size: 7rem;
            line-height: 1;
            color: #2563eb;
            margin-bottom: 20px;
            user-select: none;
            display: inline-block;
        }

        /* Shake Animation */
        @keyframes shake {
            0% { transform: rotate(0deg);}
            25% { transform: rotate(15deg);}
            50% { transform: rotate(-15deg);}
            75% { transform: rotate(10deg);}
            100% { transform: rotate(0deg);}
        }

        .rolling {
            animation: shake 0.4s ease;
        }

        .btn {
            width: 100%;
            padding: 12px;
            background-color: #2563eb;
            color: #ffffff;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn:hover {
            background-color: #1d4ed8;
        }

        .btn:disabled {
            background-color: #94a3b8;
            cursor: not-allowed;
        }

        /* History Box */

        .history-container {
            margin-top: 24px;
            text-align: left;
            border-top: 1px solid #e2e8f0;
            padding-top: 16px;
        }

        #history-list {
            list-style: none;
            max-width: 120px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .history-item {
            font-size: 0.85rem;
            background-color: #f8fafc;
            padding: 6px 10px;
            border-radius: 4px;
            color: #334155;
            display: flex;
            justify-content: space-between;
        }
    </style>
</head>
<body>

    <main class="dice-card">

        <h2>Dice Roll Simulator</h2>

        <!-- Dice face display -->
        <div id="dice" class="dice-display">&#9856;</div>

        <!-- Roll action button -->
        <button id="roll-btn" class="btn">Roll Dice</button>

        <!-- History list -->
        <div class="history-container">
            <h3>Roll History</h3>
            <ul id="history-list"></ul>
        </div>
    </main>

    <script src="index.js"></script>
</body>
</html>
